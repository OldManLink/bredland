name: Tests

on:
  pull_request:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP 5.5 test image
        uses: docker/build-push-action@v7
        with:
          context: tests/docker/php55
          platforms: linux/amd64
          load: true
          tags: bredland/php55-test:latest
          cache-from: type=gha,scope=php55-test
          cache-to: type=gha,mode=max,scope=php55-test

      - name: Run tests
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            bredland/php55-test:latest \
            bash tests/in-container.sh
          